    <style>
      :root{--canvas:#fafbfc;--paper:#fff;--ink:#202b39;--muted:#687687;--blue:#527eaf;--folder:#edf3fb;--edge:#c8d8eb;--wire:#91add0;--rule:#e4e9f0}
      @media(prefers-color-scheme:dark){:root{--canvas:#111922;--paper:#1c2a3a;--ink:#e8eef6;--muted:#a2b0c1;--blue:#97bce9;--folder:#1a2e46;--edge:#38516e;--wire:#7398c6;--rule:#2b3b4e}}
      text{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--ink)}
      .display{font-size:36px;font-weight:650;letter-spacing:-1.1px}
      .body{font-size:16px;fill:var(--muted)}
      .eyebrow{font-size:11px;font-weight:650;letter-spacing:1.6px;fill:var(--muted)}
      .agent{font-size:20px;font-weight:600;letter-spacing:-.3px}
      .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
      .path{font-size:13px;fill:var(--muted)}
      .wire{fill:none;stroke:var(--wire);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
      .icon{fill:none;stroke:var(--muted);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
      .brand{fill:var(--blue)}
      #agent-codex path{fill:var(--ink)}
    </style>
