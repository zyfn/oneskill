<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="510" viewBox="0 0 1040 510" role="img" aria-labelledby="title desc">
  <title id="title">oneskill architecture</title>
  <desc id="desc">Web, CLI and the Codex MCP App share one local Workspace service. The service manages a Skill library, scans Agent directories, and creates symbolic links without copying the shared source for every Agent.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 7 4 1 7" fill="none" stroke="#657b96" stroke-width="1.5"/></marker>
    <style>text{font-family:ui-sans-serif,system-ui,sans-serif;fill:#273342}.label{font-size:19px;font-weight:600}.note{font-size:14px;fill:#586a7d}.line{fill:none;stroke:#657b96;stroke-width:1.5;marker-end:url(#arrow)}.box{fill:#f6f8fb;stroke:#ccd5e0;stroke-width:1.2}</style>
  </defs>
  <rect x="1" y="1" width="1038" height="508" rx="22" fill="#edf1f6" stroke="#dce3ec"/>
  <rect class="box" x="40" y="32" width="280" height="78" rx="14"/>
  <text class="label" x="180" y="65" text-anchor="middle">Web UI</text><text class="note" x="180" y="89" text-anchor="middle">React · local HTTP</text>
  <rect class="box" x="380" y="32" width="280" height="78" rx="14"/>
  <text class="label" x="520" y="65" text-anchor="middle">CLI</text><text class="note" x="520" y="89" text-anchor="middle">JSON commands</text>
  <rect class="box" x="720" y="32" width="280" height="78" rx="14"/>
  <text class="label" x="860" y="65" text-anchor="middle">Codex plugin</text><text class="note" x="860" y="89" text-anchor="middle">Shared UI · MCP Apps · tools</text>
  <path d="M180 110V145H520M860 110V145H520" fill="none" stroke="#657b96" stroke-width="1.5"/>
  <path class="line" d="M520 110V186"/>
  <rect x="280" y="188" width="480" height="98" rx="17" fill="#e0e8f2" stroke="#aebfd3" stroke-width="1.2"/>
  <text class="label" x="520" y="225" text-anchor="middle">Local Workspace service</text>
  <text class="note" x="520" y="251" text-anchor="middle">One operation contract · snapshots · serialized writes</text>
  <text class="note" x="520" y="272" text-anchor="middle">127.0.0.1 · authenticated access</text>
  <path class="line" d="M390 286V318H230V352"/>
  <path class="line" d="M650 286V318H810V352"/>
  <text class="note" x="246" y="338" text-anchor="start">Read and manage</text><text class="note" x="826" y="338" text-anchor="start">Discover, scan and link</text>
  <rect class="box" x="50" y="354" width="360" height="86" rx="14"/>
  <text class="label" x="230" y="389" text-anchor="middle">Skill library</text><text class="note" x="230" y="415" text-anchor="middle">~/.oneskill/skills</text>
  <rect class="box" x="630" y="354" width="360" height="86" rx="14"/>
  <text class="label" x="810" y="389" text-anchor="middle">Agent directories</text><text class="note" x="810" y="415" text-anchor="middle">Skills · plugin manifests · MCP configs</text>
  <path class="line" d="M810 440V478H230V440"/>
  <rect x="325" y="463" width="390" height="28" rx="8" fill="#edf1f6"/>
  <text class="note" x="520" y="482" text-anchor="middle">Symbolic links reference the shared source files</text>
</svg>
