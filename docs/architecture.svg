<svg xmlns="http://www.w3.org/2000/svg" width="1184" height="552" viewBox="0 0 1184 552" role="img" aria-labelledby="title description">
  <title id="title">One Skill library. Many Agents.</title>
  <desc id="description">Skill packages live in the user's .oneskill/skills library. Selected Agents, illustrated by Codex, Claude Code and Cursor, read the same packages through symbolic links in their configured Skill directories. Web, CLI and the Codex plugin manage the library through one local Workspace service.</desc>
