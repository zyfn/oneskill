<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img" aria-labelledby="title description">
  <title id="title">oneskill — one library, three entrypoints</title>
  <desc id="description">Web, CLI and the Codex plugin connect to one authenticated local Workspace service. It moves imported Skills into the user's .oneskill library with backups, manages links in Agent directories, and reads plugin and MCP declarations. Agent links point back to the canonical library packages. Private runtime state is kept separately in the system temporary directory.</desc>
  <defs>
    <style>
      :root{--canvas:#f3f6fa;--panel:#fff;--ink:#172e47;--muted:#60768e;--line:#d8e2ee;--blue:#3d6da4;--tint:#eaf1f9;--wire:#8ca5c0}
      @media(prefers-color-scheme:dark){:root{--canvas:#101b2b;--panel:#19293d;--ink:#e6eef8;--muted:#a3b6ce;--line:#344860;--blue:#9abce8;--tint:#223a56;--wire:#7496bd}}
      text{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--ink)}
      .eyebrow{font-size:12px;font-weight:700;letter-spacing:2px;fill:var(--blue)}
      .heading{font-size:30px;font-weight:650;letter-spacing:-.8px}
      .title{font-size:20px;font-weight:650;letter-spacing:-.3px}
      .body{font-size:14px;fill:var(--muted)}
      .label{font-size:13px;font-weight:600;fill:var(--blue)}
      .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:14px}
      .card{fill:var(--panel);stroke:var(--line);stroke-width:1.2}
      .tint{fill:var(--tint)}
      .icon{fill:none;stroke:var(--blue);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
      .wire{fill:none;stroke:var(--wire);stroke-width:1.6}
      .flow{fill:none;stroke:var(--wire);stroke-width:1.6;marker-end:url(#arrow)}
      .reference{fill:none;stroke:var(--blue);stroke-width:1.6;stroke-dasharray:5 5;marker-end:url(#reference-arrow)}
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="m1 1 6 3-6 3" fill="none" stroke="var(--wire)" stroke-width="1.5"/></marker>
    <marker id="reference-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="m1 1 6 3-6 3" fill="none" stroke="var(--blue)" stroke-width="1.5"/></marker>
  </defs>

  <rect x="1" y="1" width="1118" height="758" rx="24" fill="var(--canvas)" stroke="var(--line)"/>
  <text class="eyebrow" x="40" y="43">ONESKILL / LOCAL ARCHITECTURE</text>
  <text class="heading" x="40" y="84">One library. Three entrypoints.</text>
  <text class="body" x="40" y="111">Same files, same operations — wherever you open your workspace.</text>
  <g transform="translate(1000 42)" class="icon" opacity=".55">
    <path d="M0 0v40q0 14 14 14h36M0 40q0 14-14 14h-18M0 19q0 13 14 13h36"/>
    <circle cx="0" cy="0" r="5" fill="var(--canvas)"/><circle cx="50" cy="54" r="5" fill="var(--canvas)"/><circle cx="50" cy="32" r="5" fill="var(--canvas)"/><circle cx="-32" cy="54" r="5" fill="var(--canvas)"/>
  </g>

  <g transform="translate(40 144)">
    <rect class="card" width="328" height="96" rx="16"/>
    <rect class="tint" x="20" y="22" width="48" height="48" rx="13"/>
    <g class="icon" transform="translate(31 35)"><rect width="26" height="20" rx="3"/><path d="M0 6h26M5 3h.1m4 0h.1"/></g>
    <text class="title" x="86" y="41">Web UI</text>
    <text class="body" x="86" y="66">React · local browser</text>
  </g>
  <g transform="translate(396 144)">
    <rect class="card" width="328" height="96" rx="16"/>
    <rect class="tint" x="20" y="22" width="48" height="48" rx="13"/>
    <g class="icon" transform="translate(31 35)"><rect width="26" height="20" rx="3"/><path d="m6 6 4 4-4 4m8 0h6"/></g>
    <text class="title" x="86" y="41">CLI</text>
    <text class="body" x="86" y="66">Commands · JSON results</text>
  </g>
  <g transform="translate(752 144)">
    <rect class="card" width="328" height="96" rx="16"/>
    <rect class="tint" x="20" y="22" width="48" height="48" rx="13"/>
    <g class="icon" transform="translate(31 35)"><rect x="1" y="2" width="24" height="19" rx="4"/><path d="M13 2v-4M7 9v4m12-4v4m-9 4h6"/></g>
    <text class="title" x="86" y="41">Codex plugin</text>
    <text class="body" x="86" y="66">Shared UI · MCP tools</text>
  </g>

  <path class="wire" d="M204 240v30h712v-30"/>
  <path class="flow" d="M560 240v58"/>
  <circle cx="560" cy="270" r="3" fill="var(--wire)"/>

  <rect class="card" x="40" y="300" width="1040" height="158" rx="18"/>
  <rect x="40" y="324" width="4" height="44" rx="2" fill="var(--blue)"/>
  <text class="title" x="64" y="338">Local Workspace service</text>
  <text class="body" x="64" y="363">One validated operation contract for every entrypoint.</text>
  <rect class="tint" x="838" y="322" width="218" height="32" rx="16"/>
  <circle cx="856" cy="338" r="3.5" fill="var(--blue)"/>
  <text class="label" x="870" y="343">127.0.0.1 · authorized</text>
  <path d="M64 382h992" stroke="var(--line)"/>
  <g class="body">
    <text x="64" y="418">Agent discovery</text>
    <text x="306" y="418">Inventory snapshots</text>
    <text x="578" y="418">Serialized writes</text>
    <text x="828" y="418">Locks + receipts</text>
  </g>
  <path class="flow" d="M290 458v52"/>
  <path class="flow" d="M830 458v52"/>
  <text class="label" x="309" y="490">Import · verify · back up</text>
  <text class="label" x="609" y="490">Scan resources · manage links</text>

  <g transform="translate(40 512)">
    <rect class="card" width="500" height="156" rx="18"/>
    <path d="M24 32h16l5 6h25v22H24z" class="icon"/>
    <text class="title mono" x="90" y="47" style="font-size:21px;font-weight:650;fill:var(--blue)">~/.oneskill/</text>
    <text class="mono" x="24" y="91">skills/</text>
    <text class="body" x="192" y="91">Canonical Skill packages</text>
    <text class="body" x="24" y="124">Local Agent overrides · ignore preferences</text>
  </g>
  <g transform="translate(580 512)">
    <rect class="card" width="500" height="156" rx="18"/>
    <text class="title" x="24" y="38">Agent directories</text>
    <text class="body" x="24" y="68">Codex</text><text class="mono" x="136" y="68">~/.codex/skills/</text>
    <text class="body" x="24" y="94">Cursor</text><text class="mono" x="136" y="94">~/.cursor/skills/</text>
    <text class="body" x="24" y="120">Qoder</text><text class="mono" x="136" y="120">~/.qoder/skills/</text>
    <rect class="tint" x="378" y="54" width="98" height="68" rx="10"/>
    <text class="label" x="427" y="81" text-anchor="middle">Plugins · MCP</text>
    <text class="body" x="427" y="104" text-anchor="middle" style="font-size:12px">read only</text>
  </g>
  <path class="reference" d="M830 668v36H290v-36"/>
  <rect x="363" y="688" width="394" height="32" rx="16" fill="var(--canvas)"/>
  <text class="label" x="560" y="708" text-anchor="middle">Symbolic links point to the library package</text>
  <text class="body" x="560" y="740" text-anchor="middle" style="font-size:12px">Runtime credentials, locks and receipts live separately in the user's temporary directory.</text>
</svg>
